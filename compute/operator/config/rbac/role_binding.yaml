# Pairs with config/manager/manager.yaml's ServiceAccount for the
# kustomize-based install path (config/default). The Helm chart
# (charts/odoo-operator/templates/clusterrole.yaml) creates its own
# binding scoped to the release's ServiceAccount instead of this static
# name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: odoo-instance-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: odoo-instance-operator
subjects:
  - kind: ServiceAccount
    name: odoo-instance-operator
    namespace: odoo-system
