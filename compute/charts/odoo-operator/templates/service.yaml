apiVersion: v1
kind: Service
metadata:
  name: {{ include "odoo-operator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "odoo-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "odoo-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
      protocol: TCP
