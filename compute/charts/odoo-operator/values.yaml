# Default values for the odoo-operator chart.

image:
  repository: docker.io/moutazmuhammad/odoo-saas-operator
  tag: "0.1.32"
  pullPolicy: IfNotPresent
# Pull secrets for the operator pod itself (Secrets in the release
# namespace).
imagePullSecrets: []

# Name of a kubernetes.io/dockerconfigjson Secret in the release namespace
# holding credentials for the platform's own images (backup tool,
# PostgreSQL, a private Odoo base). The operator copies it into every
# tenant namespace as "odoo-platform-pull" and lists it on every tenant
# pod. Empty disables it. Usually the same Secret as imagePullSecrets.
platformPullSecret: ""

# Images the operator runs inside tenant namespaces. Empty keeps the
# operator's compiled-in default. PostgreSQL entries are repositories only:
# the tag is always the instance's spec.database.version.
images:
  # Backup and restore Jobs (overrides backup.toolImage below).
  backupTool: ""
  # Managed PostgreSQL (default docker.io/library/postgres).
  postgresRepository: ""
  # CloudNativePG operand (default ghcr.io/cloudnative-pg/postgresql).
  cnpgPostgresRepository: ""


# Use ordinary list/watch by default for compatibility with MicroK8s/dqlite.
# Clusters with working streaming initial events may enable this explicitly.
kubernetesClient:
  watchList: false

serviceAccount:
  create: true
  name: ""
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

metrics:
  # Whether to serve /metrics over HTTPS. Disable only for local
  # development (e.g. a plain `kubectl port-forward` without a client
  # certificate).
  secure: true
  # Creates a Prometheus Operator ServiceMonitor. Requires the
  # monitoring.coreos.com CRDs to be installed; safe to leave false
  # otherwise.
  serviceMonitor:
    enabled: false
    interval: 30s

# Platform-wide networking configuration. See setup/01-ARCHITECTURE.md
# ("Networking") for why this is an operator-level setting rather than a
# per-tenant OdooInstance field.
networking:
  # "gateway-api" (preferred, requires the Gateway API CRDs) or "ingress".
  provider: gateway-api
  gateway:
    namespace: gateway-system
    name: odoo-saas-gateway
    podSelector:
      app.kubernetes.io/name: odoo-saas-gateway
  ingressClassName: ""

# Restricts spec.version on every OdooInstance to this list. Empty
# disables the check (development convenience only).
supportedOdooVersions:
  - "17.0"
  - "18.0"
  - "19.0"
  - "20.0"

# Allows spec.image.tag values such as "latest". Leave false in production;
# the platform's image pipeline should always produce immutable tags.
allowMutableTags: false

backup:
  # Overrides internal/resources.DefaultBackupToolImage. Leave empty to use
  # the compiled-in default. Superseded by images.backupTool; kept for
  # existing installs.
  toolImage: ""

restore:
  # Overrides internal/resources.DefaultRestoreToolImage. Leave empty to
  # use the backup tool image. Only used by instances that set
  # spec.restore (see setup/01-ARCHITECTURE.md, "Restoring an Existing
  # Backup").
  toolImage: ""

# Extra command-line args appended verbatim to the manager container.
extraArgs: []

podAnnotations: {}
podLabels: {}
