# Kept as a hand-maintained Helm template (not a generated copy) so it can
# carry release-scoped naming/labels. Source of truth for the RULE LIST
# itself is operator/config/rbac/role.yaml, generated by controller-gen
# from the +kubebuilder:rbac markers on OdooInstanceReconciler
# (operator/internal/controller/odooinstance_controller.go). Run
# `make manifests` after adding a marker and hand-sync any rule changes
# here — see that Makefile target's note.
#
# This is the operator's ENTIRE permission set. Notably absent: no
# wildcard apiGroups/resources/verbs, no secrets read across all
# namespaces (RBAC here is intentionally cluster-scoped only because
# OdooInstance's child resources span tenant namespaces the operator
# itself creates — see docs/architecture.md, "Security").
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "odoo-operator.fullname" . }}
  labels:
    {{- include "odoo-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - limitranges
      - namespaces
      - persistentvolumeclaims
      - resourcequotas
      - secrets
      - serviceaccounts
      - services
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [saas.odoo.example.com]
    resources: [odooinstances]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [saas.odoo.example.com]
    resources: [odooinstances/finalizers]
    verbs: [update]
  - apiGroups: [saas.odoo.example.com]
    resources: [odooinstances/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "odoo-operator.fullname" . }}
  labels:
    {{- include "odoo-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "odoo-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "odoo-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
