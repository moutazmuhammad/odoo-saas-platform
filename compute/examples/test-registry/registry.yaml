# In-cluster OCI registry for TEST clusters (single-node microk8s-style),
# used by the control plane's tenant image builds (Region > Tenant Image
# Builds). Production should use a managed/HA registry instead (Harbor,
# GHCR, ECR, ...) — any OCI registry works.
#
# - Builds push to   registry.container-registry.svc.cluster.local:5000
#   (Region "Registry Push Host", plain HTTP → "Plain-HTTP Registry" on).
# - Nodes pull from  localhost:32000 via the NodePort below (microk8s'
#   containerd treats localhost:32000 as a plain-HTTP registry by default).
# - htpasswd basic auth is required; create the Secret first:
#     kubectl -n container-registry create secret generic registry-auth \
#       --from-literal=htpasswd="$(htpasswd -nbB <user> <password>)"
apiVersion: v1
kind: Namespace
metadata:
  name: container-registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: container-registry
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: container-registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: registry}
  template:
    metadata:
      labels: {app: registry}
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          ports:
            - containerPort: 5000
          env:
            - {name: REGISTRY_AUTH, value: htpasswd}
            - {name: REGISTRY_AUTH_HTPASSWD_REALM, value: registry}
            - {name: REGISTRY_AUTH_HTPASSWD_PATH, value: /auth/htpasswd}
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
            - {name: auth, mountPath: /auth, readOnly: true}
          readinessProbe:
            tcpSocket: {port: 5000}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: registry-data}
        - name: auth
          secret: {secretName: registry-auth}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: container-registry
spec:
  type: NodePort
  selector: {app: registry}
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 32000
