name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild and deploy every owned component
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Never cancel an in-progress database migration or Helm upgrade.
concurrency:
  group: >-
    delivery-${{ github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'production' || github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    # Temporary direct deployment: no CI validation prerequisite.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      operator: ${{ steps.plan.outputs.operator }}
      backup: ${{ steps.plan.outputs.backup }}
      chart: ${{ steps.plan.outputs.chart }}
      saas: ${{ steps.plan.outputs.saas }}
      images: ${{ steps.plan.outputs.images }}
      clusters: ${{ steps.plan.outputs.clusters }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Compare with last completely successful delivery
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          FORCE_FULL: ${{ inputs.full || false }}
          CLUSTERS: ${{ vars.DEPLOY_CLUSTERS }}
        run: |
          set -euo pipefail
          # A queued older commit must not overwrite a newer main deployment.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" != "$TARGET_SHA" ]]; then
            echo 'Commit superseded on main; skipping delivery.'
            for component in operator backup chart saas; do echo "$component=false" >> "$GITHUB_OUTPUT"; done
            echo 'images=[]' >> "$GITHUB_OUTPUT"
            echo 'clusters=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=''
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cd.yml/runs?branch=main&status=success&per_page=100" \
            --jq '.workflow_runs[] | [.id, .head_sha, .event] | @tsv')
          while IFS=$'\t' read -r run_id commit event; do
            [[ -n "$run_id" ]] || continue
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")
            receipt=$(jq -r '[.artifacts[] | select(.expired == false and (.name | test("^delivered-[a-f0-9]{40}$")))][0].name // ""' <<< "$artifacts")
            if [[ -n "$receipt" ]]; then base=${receipt#delivered-}; break; fi
            # Compatibility with receipts from the previous push-based CD.
            if [[ "$event" != workflow_run ]] && jq -e 'any(.artifacts[]; .name == "delivered" and .expired == false)' <<< "$artifacts" >/dev/null; then
              base=$commit
              break
            fi
          done <<< "$runs"
          if [[ "$FORCE_FULL" == true ]]; then base=''; fi
          selection=$(python3 scripts/ci/changes.py "$base" "$TARGET_SHA")
          for component in operator backup chart saas; do
            echo "$component=$(jq -r ".$component" <<< "$selection")" >> "$GITHUB_OUTPUT"
          done
          matrix=$(jq -c '[to_entries[] | select(.value == true and (.key == "operator" or .key == "backup")) | if .key == "operator" then {name: "operator", context: "compute/operator", repository: "odoo-saas-operator"} else {name: "backup", context: "compute/tools/backup-tool", repository: "odoo-saas-backup-tool"} end]' <<< "$selection")
          echo "images=$matrix" >> "$GITHUB_OUTPUT"
          if [[ $(jq '.operator or .backup or .chart' <<< "$selection") == true ]]; then
            jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and test("^[a-zA-Z0-9_-]+$"))' <<< "$CLUSTERS" >/dev/null
            echo "clusters=$(jq -c . <<< "$CLUSTERS")" >> "$GITHUB_OUTPUT"
          else
            echo 'clusters=[]' >> "$GITHUB_OUTPUT"
          fi
          {
            echo "sha=$TARGET_SHA"
            echo "tag=sha-$TARGET_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release selection"
            echo "Base: ${base:-first/full release}; target: $TARGET_SHA"
            echo "$selection"
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    needs: plan
    if: needs.plan.outputs.saas == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/veltnex/package-lock.json
      - name: Install frontend build dependencies
        working-directory: frontend/veltnex
        run: npm ci
      - name: Build SPA without tests or typechecking
        working-directory: frontend/veltnex
        run: npx --no-install vite build
      - name: Package control plane and freshly built SPA
        run: tar -czf /tmp/saas-release.tar.gz control-plane
      - uses: actions/upload-artifact@v4
        with:
          name: saas-release
          path: /tmp/saas-release.tar.gz
          retention-days: 14

  images:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    environment: production-images
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      REGISTRY: ${{ vars.IMAGE_REGISTRY || 'docker.io' }}
      NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate registry configuration
        run: test -n "$NAMESPACE"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.repository }}:${{ needs.plan.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

  operator:
    needs: [plan, images]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.clusters != '[]' &&
      (needs.plan.outputs.images == '[]' || needs.images.result == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cluster: ${{ fromJSON(needs.plan.outputs.clusters) }}
    environment: ${{ matrix.cluster }}
    env:
      REGISTRY: ${{ vars.IMAGE_REGISTRY || 'docker.io' }}
      NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.3
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Deploy CRDs, operator and backup/restore image settings
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          VALUES_YAML: ${{ secrets.OPERATOR_VALUES_YAML }}
          OPERATOR_CHANGED: ${{ needs.plan.outputs.operator }}
          BACKUP_CHANGED: ${{ needs.plan.outputs.backup }}
          IMAGE_TAG: ${{ needs.plan.outputs.tag }}
          OPERATOR_NAMESPACE: ${{ vars.OPERATOR_NAMESPACE || 'odoo-system' }}
          OPERATOR_RELEASE: ${{ vars.OPERATOR_RELEASE || 'odoo-operator' }}
        run: |
          set -euo pipefail
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          export OPERATOR_VALUES_FILE="$RUNNER_TEMP/operator-values.yaml"
          trap 'rm -f "$KUBECONFIG" "$OPERATOR_VALUES_FILE"' EXIT
          test -n "$KUBECONFIG_B64"
          test -n "$VALUES_YAML"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$KUBECONFIG"
          printf '%s' "$VALUES_YAML" > "$OPERATOR_VALUES_FILE"
          if [[ "$OPERATOR_CHANGED" == true ]]; then
            export OPERATOR_IMAGE="$REGISTRY/$NAMESPACE/odoo-saas-operator:$IMAGE_TAG"
          fi
          if [[ "$BACKUP_CHANGED" == true ]]; then
            export BACKUP_IMAGE="$REGISTRY/$NAMESPACE/odoo-saas-backup-tool:$IMAGE_TAG"
          fi
          scripts/deploy/operator.sh

  saas:
    needs: [plan, package, images, operator]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.saas == 'true' &&
      needs.package.result == 'success' &&
      (needs.plan.outputs.images == '[]' || needs.images.result == 'success') &&
      (needs.plan.outputs.clusters == '[]' || needs.operator.result == 'success')
    runs-on: ubuntu-latest
    environment: production-saas
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: saas-release
          path: release
      - name: Upload built release and deploy both systemd services
        env:
          TARGET_SHA: ${{ needs.plan.outputs.sha }}
          SSH_HOST: ${{ secrets.SAAS_SSH_HOST }}
          SSH_USER: ${{ secrets.SAAS_SSH_USER }}
          SSH_KEY: ${{ secrets.SAAS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SAAS_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.SAAS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ && "$SSH_PORT" =~ ^[0-9]+$ ]]
          umask 077
          key="$RUNNER_TEMP/deploy-key"
          known="$RUNNER_TEMP/known-hosts"
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known"
          options=(-i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known")
          # Refuse an outdated installed deploy script before entering maintenance.
          expected=$(sha256sum scripts/deploy/saas-deploy.sh | cut -d ' ' -f1)
          installed=$(ssh "${options[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'sha256sum /usr/local/sbin/saas-deploy' | cut -d ' ' -f1)
          if [[ "$installed" != "$expected" ]]; then
            echo '::error::Server deployment script is outdated. Reinstall scripts/deploy/saas-deploy.sh as /usr/local/sbin/saas-deploy before retrying.'
            exit 1
          fi
          release_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$TARGET_SHA"
          scp "${options[@]}" -P "$SSH_PORT" release/saas-release.tar.gz \
            "$SSH_USER@$SSH_HOST:/var/lib/saas-deploy/incoming/$release_id.tar.gz"
          ssh "${options[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "sudo -n /usr/local/sbin/saas-deploy $release_id"

  delivered:
    needs: [plan, images, operator, saas]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.tag != '' &&
      (needs.plan.outputs.images == '[]' || needs.images.result == 'success') &&
      (needs.plan.outputs.clusters == '[]' || needs.operator.result == 'success') &&
      (needs.plan.outputs.saas != 'true' || needs.saas.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Record fully delivered commit
        env:
          TARGET_SHA: ${{ needs.plan.outputs.sha }}
        run: printf '%s\n' "$TARGET_SHA" > delivered.txt
      - uses: actions/upload-artifact@v4
        with:
          name: delivered-${{ needs.plan.outputs.sha }}
          path: delivered.txt
          retention-days: 90
