# Production-style example: TLS via cert-manager, scheduled backups to
# object storage, an explicit ResourceQuota, and platform-built addons
# baked into the image (see docs/architecture.md, "Addons & Image
# Strategy" — addons are never installed at runtime from this list).
apiVersion: saas.odoo.example.com/v1alpha1
kind: OdooInstance
metadata:
  name: customer-globex
spec:
  version: "18.0"

  image:
    repository: registry.example.com/odoo-saas/odoo
    tag: "18.0-2026.09.01-globex"  # immutable, content-addressed by the platform's build pipeline
    pullPolicy: IfNotPresent
    pullSecretRefs:
      - name: registry-example-com-pull-secret

  domain:
    hostname: globex.saas.example.com
    tls:
      enabled: true
      issuerRef:
        name: letsencrypt-production
        kind: ClusterIssuer
        group: cert-manager.io

  database:
    mode: Managed
    version: "16"
    storage:
      size: 100Gi
      storageClassName: premium-ssd

  storage:
    filestore:
      size: 200Gi
      storageClassName: premium-ssd
      accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

  addons:
    - name: sale
    - name: account
    - name: mrp
    - name: globex_custom_reporting

  workers:
    count: 4
    maxCronThreads: 2

  replicas: 1

  backup:
    enabled: true
    schedule: "0 2 * * *"
    retention: 30
    destination:
      type: ObjectStorage
      objectStorageSecretRef:
        name: globex-backup-object-storage
      bucket: odoo-saas-backups
      prefix: globex/

  networking:
    networkPolicy:
      enabled: true

  tenancy:
    resourceQuota:
      requests.cpu: "8"
      requests.memory: 16Gi
      limits.cpu: "16"
      limits.memory: 32Gi
      requests.storage: 500Gi
      pods: "20"
